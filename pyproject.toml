[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-automations"
version = "0.1.0"
description = "Reusable Python and Telethon CLI for Telegram scripts and automations."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "ihoru" }]
keywords = ["telegram", "telethon", "automation", "cli", "polls"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "Telethon==1.44.0",
  "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = ["ruff==0.16.2"]

[project.scripts]
telegram-automations = "telegram_automations.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "SIM", "B", "ASYNC", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"src/telegram_automations/commands/remove_non_voters.py" = ["ASYNC250"]
