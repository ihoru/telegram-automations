name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall -q src tests

      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

      - name: Smoke-test CLI help
        run: |
          telegram-automations --help
          telegram-automations poll --help
          telegram-automations poll check-payments --help
          telegram-automations poll list-without-answer --help
          telegram-automations poll list-non-voters --help
          telegram-automations poll remove-non-voters --help
